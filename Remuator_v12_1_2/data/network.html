<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сеть и время — Remuage-VRN</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/network.js"></script>
    <script src="/site-shell.js" defer></script>
  </head>
  <body>
    <header id="siteHeader"></header>
    <main>
      <h1>Сеть и время</h1>
      <div id="error" role="alert" hidden></div>
      <section class="card">
        <h2>Соединение</h2>
        <p id="addresses">Загрузка…</p>
        <p id="controllerClock"></p>
        <p id="browserClock"></p>
        <div class="toolbar">
          <button id="syncBrowser" disabled>Установить время из браузера</button
          ><button id="ntp" disabled>Синхронизировать NTP</button
          ><a class="button" href="/settings">Настроить часовой пояс OLED</a>
        </div>
      </section>
      <form id="networkForm" action="/network/save" class="card">
        <fieldset disabled>
          <h2>Точка доступа контроллера</h2>
          <div class="fields">
            <label
              >Имя сети AP<input name="apssid" maxlength="32" required /></label
            ><label
              >Пароль AP<input
                name="appass"
                type="password"
                minlength="8"
                maxlength="63"
                required
                autocomplete="new-password"
            /></label>
          </div>
          <h2>Домашняя Wi-Fi</h2>
          <label class="check"
            ><input type="checkbox" name="homeen" /> Подключаться к домашней
            сети</label
          >
          <div class="fields">
            <label
              >SSID<input name="ssid" maxlength="32" list="ssidList" /><datalist
                id="ssidList"
              ></datalist></label
            ><label
              >Пароль<input
                name="pass"
                type="password"
                maxlength="63"
                autocomplete="new-password"
            /></label>
          </div>
          <p class="muted">
            При смене параметров сети соединение прервётся. Подключитесь к
            указанной сети заново.
          </p>
          <button class="primary">Сохранить настройки сети</button>
        </fieldset>
      </form>
      <section class="card">
        <button id="scan" disabled>Сканировать сети</button>
        <div id="networks"></div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
</main>
    <footer id="siteFooter"></footer>
  </body>
</html>
